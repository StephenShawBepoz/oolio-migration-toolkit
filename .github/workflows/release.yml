# Builds and publishes OolioMigration.zip.
#
# Two ways to release:
#   1. Push a v* tag:        git tag v1.6 && git push origin v1.6
#   2. Push a release/v* branch (e.g. release/v1.6) - the workflow derives the
#      tag from the branch name, creates the tag ref itself at the commit it
#      builds, then deletes the branch. This exists for environments whose git
#      remotes accept branch pushes but cannot push tag refs.
#   3. Run it from the Actions tab (workflow_dispatch) with the tag as input.
#
# Either way, the workflow refuses to ship if TOOLKIT_VERSION in ui/app.js does
# not match the tag, so the version badge technicians see can never drift from
# the release they installed. bootstrap.ps1 picks the new asset up automatically
# via releases/latest/download/ - no other step needed.

name: release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create at this commit (e.g. v1.6)"
        required: true
        type: string

permissions:
  contents: write   # create the tag + release, upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' }
                 elseif ('${{ github.ref_name }}' -like 'release/*') { '${{ github.ref_name }}'.Substring('release/'.Length) }
                 else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d') {
            Write-Host "::error::'$tag' does not look like a release tag (expected v<major>...)."
            exit 1
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing as: $tag"

      - name: Verify TOOLKIT_VERSION matches the tag
        shell: pwsh
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $appJs = Get-Content ui/app.js -Raw
          if ($appJs -notmatch "const TOOLKIT_VERSION = '([^']+)'") {
            Write-Host "::error::TOOLKIT_VERSION not found in ui/app.js"
            exit 1
          }
          $uiVersion = $Matches[1]
          if ($uiVersion -ne $tag) {
            Write-Host "::error::Tag is '$tag' but ui/app.js TOOLKIT_VERSION is '$uiVersion'. Update the badge (and CHANGELOG) before tagging."
            exit 1
          }
          Write-Host "Version check OK: $tag"

      - name: Run pattern safety tests
        shell: pwsh
        run: ./tests/patterns.tests.ps1

      - name: Build OolioMigration.zip
        shell: pwsh
        run: ./build-release.ps1

      - name: Create tag (when not triggered by a tag push)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            EXISTING=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq .object.sha)
            if [ "$EXISTING" != "${{ github.sha }}" ]; then
              echo "::error::Tag $TAG already exists at $EXISTING (this build is ${{ github.sha }}). Delete it or pick a new version."
              exit 1
            fi
            echo "Tag $TAG already exists at this commit."
          else
            gh api "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" -f sha='${{ github.sha }}'
            echo "Created tag $TAG at ${{ github.sha }}"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.tag.outputs.tag }}' \
            'dist/OolioMigration.zip' \
            --title '${{ steps.tag.outputs.tag }}' \
            --notes 'See CHANGELOG.md for details. Install with the bootstrap one-liner in README.md.' \
            --verify-tag

      - name: Delete the release/* trigger branch
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}" \
            || echo "Branch cleanup failed - delete the release branch manually (harmless)."
