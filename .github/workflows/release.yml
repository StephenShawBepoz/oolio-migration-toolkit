# Builds and publishes OolioMigration.zip whenever a v* tag is pushed.
#
#   git tag v1.6 && git push origin v1.6     <- this IS the release process
#
# The workflow refuses to ship if TOOLKIT_VERSION in ui/app.js does not match
# the tag, so the version badge technicians see can never drift from the
# release they installed. bootstrap.ps1 picks the new asset up automatically
# via releases/latest/download/ - no other step needed.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the release + upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify TOOLKIT_VERSION matches the tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $appJs = Get-Content ui/app.js -Raw
          if ($appJs -notmatch "const TOOLKIT_VERSION = '([^']+)'") {
            Write-Host "::error::TOOLKIT_VERSION not found in ui/app.js"
            exit 1
          }
          $uiVersion = $Matches[1]
          if ($uiVersion -ne $tag) {
            Write-Host "::error::Tag is '$tag' but ui/app.js TOOLKIT_VERSION is '$uiVersion'. Update the badge (and CHANGELOG) before tagging."
            exit 1
          }
          Write-Host "Version check OK: $tag"

      - name: Run pattern safety tests
        shell: pwsh
        run: ./tests/patterns.tests.ps1

      - name: Build OolioMigration.zip
        shell: pwsh
        run: ./build-release.ps1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' \
            'dist/OolioMigration.zip' \
            --title '${{ github.ref_name }}' \
            --notes 'See CHANGELOG.md for details. Install with the bootstrap one-liner in README.md.' \
            --verify-tag
